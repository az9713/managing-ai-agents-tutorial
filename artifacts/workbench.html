<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent charter builder</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151e;color:#e6edf7}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1050px;margin-inline:auto}h1{font-size:1.7rem;margin-top:0}p{color:#b8c5d7;line-height:1.6}label{display:block;font-weight:600;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}input,textarea{font:inherit;background:#192333;color:#f0f5fc;border:1px solid #60718b;border-radius:7px;width:100%;padding:11px;resize:vertical}textarea{min-height:90px}input:focus,textarea:focus,button:focus-visible{outline:3px solid #87baff;outline-offset:2px}fieldset{border:1px solid #60718b;border-radius:10px;margin:24px 0;padding:18px}legend{font-weight:700;padding:0 8px}.check{display:flex;gap:12px;align-items:start;font-weight:400;line-height:1.5;margin:12px 0}.check input{width:20px;height:20px;flex:none;margin-top:2px}button{font:inherit;font-weight:700;background:#acd0ff;color:#0c1a2d;border:0;border-radius:7px;padding:12px 18px;cursor:pointer}button.secondary{background:#25354c;color:#e6edf7;border:1px solid #60718b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192333;padding:18px;border-radius:8px;line-height:1.6;font-size:14px}#status{min-height:26px;color:#9eddb8}#readiness{font-weight:600;color:#f0d092}@media(max-width:650px){body{padding:16px}.grid{grid-template-columns:1fr}}@media print{button{display:none}body{color:#000;background:#fff}input,textarea,pre{color:#000;background:#fff}}
</style></head><body>
<h1>Write your first agent charter</h1>
<p>Choose one task. Record what it can touch and how you will check it. Export the result for the onboarding interview. This form plans an agent; it grants no access and starts no automation.</p>
<div class="grid" id="fields"></div>
<fieldset><legend>Pilot readiness evidence</legend><div id="checks"></div><p id="readiness" aria-live="polite"></p></fieldset>
<button id="download">Download charter</button> <button id="copy" class="secondary">Copy charter</button>
<p id="status" role="status"></p><details><summary>Preview exported text</summary><pre id="preview"></pre></details>
<script>
const defs=[['job','Assigned job'],['owner','Human owner'],['inputs','Selected input sources'],['output','Output and destination'],['steps','Manual steps and decisions'],['quality','Good and bad output examples'],['metric','One metric with baseline and target'],['permissions','Tools and actual enforcement layer'],['validation','Acceptance checks and evidence'],['limits','Trigger, limits, escalation, and pause procedure'],['review','Last human review date and reviewer']];
const criteria=['The job and first pilot are explicit','Effective permissions have been inspected','Checks include a plausible failure example','A human owner and pause procedure are recorded','A human has reviewed the pilot output'];
const inputs={},checks=[];let applying=false;
const modelFrom=s=>s&&s.modelContent&&s.modelContent.version===1?s.modelContent:null;
const storageKey='agent-management-charter-v1';
function readState(){if(window.openai)return modelFrom(window.openai.widgetState);try{return modelFrom(JSON.parse(localStorage.getItem(storageKey)))}catch{return null}}
function text(){return 'AGENT CHARTER\n\n'+defs.map(([id,label])=>label+':\n'+inputs[id].value).join('\n\n')+'\n\nREADINESS EVIDENCE\n'+criteria.map((c,i)=>(checks[i].checked?'[x] ':'[ ] ')+c).join('\n')+'\n\nThis charter does not implement permissions or activate a schedule.\n'}
function render(){document.querySelector('#preview').textContent=text();const n=checks.filter(c=>c.checked).length;document.querySelector('#readiness').textContent=n+' of '+checks.length+' evidence items recorded. '+(n===checks.length?'Review the pilot results before extending authority.':'Complete the missing evidence before considering proactive execution.')}
function apply(model){applying=true;for(const [id]of defs)inputs[id].value=typeof model?.fields?.[id]==='string'?model.fields[id].slice(0,600):'';checks.forEach((el,i)=>el.checked=model?.checks?.[i]===true);applying=false;render()}
function save(){render();if(applying)return;const fields=Object.fromEntries(defs.map(([id])=>[id,inputs[id].value]));const model={version:1,fields,checks:checks.map(c=>c.checked)};try{if(window.openai?.setWidgetState){const current=window.openai.widgetState||{};window.openai.setWidgetState({...current,modelContent:{...(current.modelContent||{}),...model}});document.querySelector('#status').textContent='Saved to the Page workbench.'}else{localStorage.setItem(storageKey,JSON.stringify({modelContent:model}));document.querySelector('#status').textContent='Saved in this browser.'}}catch{document.querySelector('#status').textContent='Saving is unavailable here. Download the charter to keep it.'}}
for(const [id,label]of defs){const box=document.createElement('div'),lab=document.createElement('label'),el=document.createElement(['job','owner','review'].includes(id)?'input':'textarea');el.id=id;el.maxLength=600;lab.htmlFor=id;lab.textContent=label;inputs[id]=el;box.append(lab,el);document.querySelector('#fields').append(box);el.addEventListener('input',save)}
criteria.forEach((label,i)=>{const row=document.createElement('label'),el=document.createElement('input'),span=document.createElement('span');row.className='check';el.type='checkbox';el.id='criterion-'+i;span.textContent=label;row.append(el,span);document.querySelector('#checks').append(row);checks.push(el);el.addEventListener('change',save)});
apply(readState());
window.addEventListener('openai:set_globals',event=>{const globals=event.detail?.globals;if(globals&&Object.prototype.hasOwnProperty.call(globals,'widgetState'))apply(modelFrom(globals.widgetState))});
document.querySelector('#download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([text()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='agent-charter.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Charter download requested.'});
document.querySelector('#copy').addEventListener('click',()=>{const box=document.createElement('textarea');box.value=text();document.body.append(box);box.select();let copied=false;try{copied=document.execCommand('copy')}catch{}box.remove();document.querySelector('#status').textContent=copied?'Charter copied.':'Clipboard unavailable. Use Download charter or select the preview text.'});
</script></body></html>
